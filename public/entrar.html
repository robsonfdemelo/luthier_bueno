<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acessar | Bueno Luthier</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#112b25 0%,#23483b 100%);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#152f28;padding:24px}.painel{width:min(100%,410px);background:#faf9f5;border-radius:18px;padding:42px 34px;box-shadow:0 26px 80px #0005;text-align:center}.logo{width:92px;height:92px;object-fit:contain}h1{font:28px Georgia,serif;margin:12px 0 5px}p{color:#67746d;margin:0 0 30px}label{text-align:left;display:block;font-weight:650;font-size:13px;margin-bottom:7px}input{width:100%;padding:14px;border:1px solid #ccd4cf;border-radius:9px;font-size:16px}button{width:100%;margin-top:18px;background:#183a30;color:#fff;padding:14px;border:none;border-radius:9px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#erro{color:#a52c29;min-height:22px;font-size:13px;margin:12px 0 0}</style>
</head><body><main class="painel"><img class="logo" src="/assets/logo-marca.webp" alt="Monograma Bueno Luthier"><h1>Bueno Luthier</h1><p>Gestão de oficina · Acesso reservado</p><form id="form"><label for="senha">Senha de acesso</label><input type="password" id="senha" minlength="1" autocomplete="current-password" required autofocus><button type="submit" id="botao">Entrar no sistema</button><div id="erro" role="alert" aria-live="polite"></div></form></main><script>
document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();const btn=document.querySelector('#botao'),erro=document.querySelector('#erro');btn.disabled=true;erro.textContent='';try{const resposta=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:document.querySelector('#senha').value})});const dados=await resposta.json();if(!resposta.ok)throw Error(dados.erro||'Não foi possível entrar.');location.assign('/');}catch(e){erro.textContent=e.message;btn.disabled=false;}});
</script></body></html>
